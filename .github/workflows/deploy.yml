name: Deploy bookshelf to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure shared storage
        run: |
          printf 'VITE_BOOKSHELF_API_URL=%s\n' "$BOOKSHELF_API_URL" >> .env.production
          printf 'VITE_BOOKSHELF_API_TOKEN=%s\n' "$BOOKSHELF_API_TOKEN" >> .env.production
        env:
          BOOKSHELF_API_URL: ${{ secrets.BOOKSHELF_API_URL }}
          BOOKSHELF_API_TOKEN: ${{ secrets.BOOKSHELF_API_TOKEN }}
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
